<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediLink — Emergency Medical Record Access</title>
    <meta name="description" content="MediLink: Instant access to critical medical information in emergencies via QR codes. Save lives with real-time medical data." />
    <!-- Theme Toggle Persistence -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('medilink_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          console.error('Theme persistence failed:', e);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
